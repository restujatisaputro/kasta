packages:
  - apps/web
  - packages/contracts
  - packages/shared

allowBuilds:
  core-js: false
  esbuild: true
  protobufjs: false
  # postinstall is only an opencollective funding banner (`opencollective-postinstall || true`);
  # the WASM core it ships (tesseract.js-core) has no build step of its own.
  tesseract.js: false

minimumReleaseAgeExclude:
  - js-yaml@4.3.1
  - '@opentelemetry/propagator-jaeger@2.9.0'
  - brace-expansion@1.1.18 || 2.1.4 || 5.0.9
  - nanoid@3.3.18
  - postcss@8.5.23
  - undici@6.28.0
  - dompurify@3.4.13
  - '@opentelemetry/core@2.8.0'
  - cookie@0.7.0
  - '@sveltejs/kit@2.70.3'

onlyBuiltDependencies:
  - esbuild

# Menutup advisory severity high pada dependensi transitif; audit CI gagal pada
# level high sehingga versi tambalan dipaksa lewat override.
overrides:
  '@opentelemetry/propagator-jaeger@<2.9.0': ^2.9.0
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  nanoid@<3.3.18: ^3.3.18
  postcss@<=8.5.22: ^8.5.23
  undici@<6.28.0: ^6.28.0
  dompurify@<=3.4.12: ^3.4.13
  '@opentelemetry/core@<2.8.0': ^2.8.0
  cookie@<0.7.0: ^0.7.0
  '@sveltejs/kit@<2.70.2': ^2.70.3
